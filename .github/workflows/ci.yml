name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Test and build browser editor
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install editor dependencies
        working-directory: editor
        run: bun install --frozen-lockfile

      - name: Test editor
        working-directory: editor
        run: bun run test

      - name: Check editor types
        working-directory: editor
        run: bun run typecheck

      - name: Build editor
        working-directory: editor
        run: bun run build

      - name: Check editor output
        shell: bash
        run: |
          set -euo pipefail

          test -s editor/dist/index.html
          test -s editor/dist/lilypond.worker.js
          test -s editor/dist/dist/lilypond.wasm
          test -s editor/dist/runtime/runtime-files.json
          test -s editor/dist/runtime/runtime-files.pack.gz
          test -s editor/dist/fonts/NimbusSans-Regular.otf
          test -s editor/dist/fonts/NimbusSans-Bold.otf
          test -s editor/dist/COPYING
          test -s editor/dist/LICENSE
          test -s editor/dist/SOURCE.md
          test -s editor/dist/EDITOR_SOURCE.md
          test -s editor/dist/THIRD_PARTY_NOTICES.md
          test -s editor/dist/assets/csound-*.js
          test -s editor/dist/licenses/csound-browser/LICENSE
          test -s editor/dist/licenses/csound-browser/THIRD_PARTY.md
          test -s editor/dist/licenses/lekton/Lekton-Regular.ttf
          test -s editor/dist/licenses/lilypond-wasm/THIRD_PARTY_NOTICES.md
          test -s editor/dist/licenses/lilypond-wasm/flake.lock
          test -s editor/dist/licenses/lilypond-wasm/nix/patches/gmp-wasi.patch
          test -s editor/dist/licenses/npm/README.md
          test -s editor/dist/licenses/npm/@csound/browser/LICENSE
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/LICENSE
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/PREBUNDLED_SOURCE.js
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/PREBUNDLED_THIRD_PARTY_NOTICES.md
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/tslib/2.8.1/LICENSE.txt
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/ieee754/1.2.1/LICENSE
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/buffer/6.0.3/LICENSE
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/url/0.11.4/LICENSE
          test -s editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/borrowed/cbor-x-MIT.txt
          test -s editor/dist/licenses/npm/@tybys/wasm-util/LICENSE
          test -s editor/dist/licenses/npm/codemirror/LICENSE
          test -s editor/dist/licenses/npm/@hlolli/codemirror-lang-csound/LICENSE
          test -s editor/dist/licenses/npm/@hlolli/codemirror-lang-csound/CSOUND_MANUAL_NOTICE.md
          test -s editor/dist/licenses/npm/@hlolli/codemirror-lang-csound/CSOUND_MANUAL_COPYING
          test -s editor/dist/licenses/npm/@hlolli/codemirror-lang-csound/THIRD_PARTY_NOTICES.md
          test -s editor/dist/licenses/npm/codemirror-lang-lilypond/LICENSE
          test -s editor/dist/source/REVISION.txt
          test -s editor/dist/source/LICENSE
          test -s editor/dist/source/THIRD_PARTY_NOTICES.md
          test -s editor/dist/source/flake.lock
          test -s editor/dist/source/nix/patches/gmp-wasi.patch
          test -s editor/dist/source/third-party/licenses/lilypond/COPYING
          test -s editor/dist/source/third-party/licenses/codemirror-lang-csound/LICENSE
          test -s editor/dist/source/third-party/licenses/codemirror-lang-csound/CSOUND_MANUAL_NOTICE.md
          test -s editor/dist/source/third-party/licenses/codemirror-lang-csound/CSOUND_MANUAL_COPYING
          test -s editor/dist/source/third-party/licenses/csound-manual/COPYING
          test -s editor/dist/source/third-party/sources/codemirror-lang-csound/REVISION.txt
          test -s editor/dist/source/third-party/sources/codemirror-lang-csound/LICENSE
          test -s editor/dist/source/third-party/sources/codemirror-lang-csound/scripts/build.ts
          test -s editor/dist/source/third-party/sources/codemirror-lang-csound/src/csound.grammar
          test -s editor/dist/source/third-party/sources/codemirror-lang-csound/src/builtin-opcodes.json
          test -s editor/dist/source/third-party/sources/codemirror-lang-csound/src/builtin-scoregens.json
          test -s editor/dist/source/npm/codemirror-lang-lilypond/src/index.ts
          test -s editor/dist/source/npm/codemirror-lang-csound/LICENSE
          test -s editor/dist/source/npm/codemirror-lang-csound/CSOUND_MANUAL_NOTICE.md
          test -s editor/dist/source/npm/codemirror-lang-csound/CSOUND_MANUAL_COPYING
          test -s editor/dist/source/npm/codemirror-lang-csound/dist/index.js
          test -s editor/dist/source/npm/codemirror-lang-csound/dist/index.js.map
          test -s editor/dist/source/editor/SOURCE_FILES.md
          test -s editor/dist/source/editor/main.ts
          test -s editor/dist/source/editor/webmcp.ts
          test -s editor/dist/source/editor/starter-source.ts
          test -s editor/dist/source/editor/licenses/npm/@hlolli/codemirror-lang-csound/LICENSE
          test -s editor/dist/source/editor/licenses/npm/@hlolli/codemirror-lang-csound/CSOUND_MANUAL_NOTICE.md
          test -s editor/dist/source/editor/licenses/npm/@hlolli/codemirror-lang-csound/CSOUND_MANUAL_COPYING
          grep -Fq 'commit: e43b2ff18e78c4d4358969999e22f5afb4948425' editor/dist/source/third-party/sources/codemirror-lang-csound/REVISION.txt
          grep -Fq 'GNU Free Documentation License' editor/dist/licenses/npm/@hlolli/codemirror-lang-csound/CSOUND_MANUAL_COPYING
          grep -Fq 'Copyright (c) Microsoft Corporation.' editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/tslib/2.8.1/LICENSE.txt
          grep -Fq 'Copyright Joyent, Inc. and other Node contributors.' editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/borrowed/NODE-JOYENT-MIT.txt
          grep -Fq 'Copyright (c) 2020 Kris Zyp' editor/dist/licenses/npm/@napi-rs/wasm-runtime/prebundled/borrowed/cbor-x-MIT.txt
          grep -Fq 'Lekton' editor/dist/assets/*.css

  checks:
    name: Validate and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: lilypond-wasm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Validate all flake outputs
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Run Linux smoke tests
        run: nix flake check --keep-going --print-build-logs --no-update-lock-file
