name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: lilypond-wasm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Validate all flake outputs
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Run Linux smoke tests
        run: nix flake check --keep-going --print-build-logs --no-update-lock-file
